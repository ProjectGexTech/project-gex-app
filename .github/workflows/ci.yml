name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web app (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml:
    name: ML server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same Python as training: the pickled models need it
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python_model/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Release gate (committed models must be level with the market)
        run: python release_gate.py

  docker:
    name: ML server (Docker image)
    runs-on: ubuntu-latest
    needs: ml
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gex-ml python_model
      - name: Start the container and wait until the models are loaded
        run: |
          docker run -d --name gex-ml -p 8000:8000 gex-ml
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/health | grep -q '"models_ready":true'; then
              echo "Healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs gex-ml
          exit 1
      - name: Call /team-stats
        run: |
          curl -sf -X POST localhost:8000/team-stats \
            -H 'Content-Type: application/json' \
            -d '{"sport_key":"soccer_epl","home_team":"Arsenal","away_team":"Tottenham Hotspur"}'
